location ~ /\.(?!well-known/) {
    deny all;
}

location ~* ^/(?:bitrix|local)/(?:modules|php_interface|backup|updates|managed_cache|stack_cache|local_cache)/ {
    deny all;
}

location ~* ^/upload/.+\.(?:php\d?|phtml|phar|pl|py|cgi|sh)$ {
    deny all;
}

location ~* ^/[^/]+\.(?:sql|log|bak|old|tar|gz|tgz|zip|7z|rar)$ {
    deny all;
}

location ~* /(?:composer\.(?:json|lock)|package(?:-lock)?\.json)$ {
    deny all;
}
